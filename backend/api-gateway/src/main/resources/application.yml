server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: profile-auth-route
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: profile-route
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/profile/**

        - id: product-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

        - id: category-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/categories/**

        - id: cart-route
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**

        - id: order-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        - id: wallet-route
          uri: lb://WALLET-SERVICE
          predicates:
            - Path=/api/wallet/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    registerWithEureka: true
    fetchRegistry: true
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
